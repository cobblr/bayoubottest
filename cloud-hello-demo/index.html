<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Cursor cloud</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #12141a;
      color: #f4f1ea;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0.85rem 0 0;
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: #c8bfb0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Cursor cloud</h1>
    <p>Grok Bot kicked this off</p>
  </main>
</body>
</html>
